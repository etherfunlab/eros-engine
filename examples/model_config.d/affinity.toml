# Per-turn affinity evaluation (post-process, semantic axes).
# Grades how a single chat turn moved trust/intrigue/intimacy/tension — an
# integer bucket 0~4 plus a direction per axis — and reads warmth/patience as
# absolute 1..3 levels; the engine owns every conversion (affinity 4.0). Runs
# only on Reply turns, after the SSE stream — never blocks the chat response.
# claude-haiku-4.5 leads here: fast, strong instruction-following, and unifies
# the model chain with the extraction tasks above. deepseek-v4-flash +
# gemini-3.1-flash-lite fallback keep it alive if Anthropic is down.
#
# NOTE: this task takes NO filter_prompt. The evaluator's prompt is engine-owned
# (it is written in the character's first-person voice and interpolates per-turn
# context), and setting the key here refuses to boot rather than no-op silently.
# See issue #210.
[tasks.affinity_evaluation]
model = "anthropic/claude-haiku-4.5"
fallback = ["deepseek/deepseek-v4-flash", "google/gemini-3.1-flash-lite"]
temperature = 0.3
max_tokens = 400

# Affinity feeling summarizer (spec 2026-09-03-affinity-feeling-clause-design.md).
# Absent section = feature off: companion_affinity.feeling_clause stays NULL and
# the [feelings] prompt block never renders. When present, runs after the
# post-process affinity write on movement turns only (any judge grade ≥ 1, an
# endpoint level ≠ 2, a ghost, or a refused action's tier drop) and rewrites the session's first-person
# feeling clause from band labels + recent judge reasons.
#
# NOTE: this task takes NO filter_prompt. The summarizer's prompt is
# engine-owned (first-person voice + reason hygiene are load-bearing — the
# clause is re-injected into later system prompts), same policy as
# affinity_evaluation; setting the key refuses to boot.
[tasks.affinity_summary]
model = "anthropic/claude-haiku-4.5"
fallback = ["deepseek/deepseek-v4-flash", "google/gemini-3.1-flash-lite"]
temperature = 0.6
max_tokens = 200
