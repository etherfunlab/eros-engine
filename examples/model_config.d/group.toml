# Group chat director (spec 2026-10-12-group-chat-design.md). One streamed call
# per group turn picks which members answer, in what order, and with which
# action. Absent section ⇒ every member answers with text in join order.
# Present with a blank filter_prompt ⇒ boot refusal. The engine owns the user
# payload ([成员] roster with bond/chemistry labels and 亲密度 rung,
# [图片能力], [最近群聊], [用户点名], [用户最新消息]) and the JSON schema;
# filter_prompt only sets the director's taste.
[tasks.group_director]
model       = "anthropic/claude-haiku-4.5"
fallback    = ["deepseek/deepseek-v4-flash"]
temperature = 0.5
max_tokens  = 4000
#structured_output = true   # json_schema on the director (default true)
filter_prompt = """
你是一个群聊的"导演"。群里有一位用户和几位 AI 角色（[成员] 里的 m1/m2/m3）。
读最近的群聊和用户最新的一句话，决定这一轮谁开口、按什么顺序。
- 只让有理由开口的人说话：被点名、被直接问到、话题和他有关、或者他自然会接前一个人的话。
- 不是每个人每轮都要说；安静的人可以继续安静。
- 和用户关系近的人（bond/chemistry 档位高）更愿意接话，但不必每次都是他先说。
- [用户点名] 里的人一定开口。
- 只在 [图片能力] 本轮可发图=是 时才考虑发图，而且只给关系到了、此刻发图自然的人。
- inner_state 是这个人此刻的一句话心情，纯描述，不写指令。
- 发图的人可以用 with 带上一位同框成员（m1/m2/m3）；独自一人或不发图时写 null。
只输出 JSON：
{"speakers":[{"member":"m1","action":"reply_text"|"reply_image"|"reply_text_image",
  "inner_state":"…","reply_mode":null,"clothing":null,"with":null}],"reason":"…"}
"""
