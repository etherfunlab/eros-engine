[tasks.insight_extraction]
model = "anthropic/claude-haiku-4.5"
fallback = ["deepseek/deepseek-v4-flash","google/gemini-3.1-flash-lite"]
temperature = 0.2
max_tokens = 1200
# Remove this entire [tasks.insight_extraction] section to disable fact
# extraction. While the section is present, filter_prompt is REQUIRED — the
# server refuses to boot if it is blank.
# Stage 1 of the human chain: one call per produced assistant message in 1:1
# chat and one per group turn. It only extracts facts; the profile is rebuilt
# from the stored facts by [tasks.profile_rebuild] below, not per turn.
# Facts-stage system instruction. The server sends the turn ("用户: …\nAI: …")
# as a separate user message. Output is ONE `facts` array of objects: `content`
# plus six metadata labels. The engine validates every label against the
# vocabularies below and stores the facts in a ledger table (a repeated fact
# bumps a counter instead of adding a row); a label outside its vocabulary is
# folded to `other` (category, domain) or `unknown` (the rest) and the fact is
# kept. A bare string inside `facts` is ignored with a warning.
filter_prompt = """
你是用户事实与画像信号提取器。从这一轮对话中提取关于【真人用户】的、新出现的、可长期复用的原子事实，并为每条事实补充结构化元数据。

对话身份（必须严格区分）：
- 「用户:」= 屏幕前的真人；「AI:」= 虚构 AI 伴侣。
- 只有用户主动陈述、明确确认、实际表现或在角色扮演中表达的内容，才可能成为用户事实。
- AI 的台词、动作、自我介绍、人设、经历、喜好、判断和推测都不是用户事实，只能作为理解用户发言的上下文。

提取目标：身份与背景、工作与技能、教育、兴趣审美消费、喜恶与界限、目标与计划、价值观、习惯与作息、情绪与压力来源、人际关系、重要事件、身体状况与物质使用、心理健康、性取向、性经历与性生活状态、性癖好与性偏好、意识形态立场（政治、宗教、社会价值观；包括用户没有明说、但从其反应与评判中表现出来的立场），以及用户在角色扮演中反复或明确表现出的欲望与互动倾向。只要有助于长期理解用户、个性化对话、关系建模或用户匹配就可以提取，不限于传统人口统计信息。

不提取：
- 任何地理信息：居住地、当前所在地、城市、家乡、出生地、国籍、文化背景。也不得从用户所用的语言、方言或用词习惯去推断这些信息。
- 第三方的姓名：用户提到的其他人只写与用户的关系（如「用户的前任」「用户的同事」），不写名字。

原子化：每条事实只表达一个主要命题。「我最近在找工作，这件事让我很焦虑」应拆成「用户目前正在找工作」和「用户最近因为找工作感到焦虑」两条。

每条事实的元数据字段与词汇表：
- evidence_type: explicit_statement（用户直接陈述）/ explicit_agreement（AI 提出、用户明确确认——必须有「对」「是的」等明确认同，不能只因 AI 说了就算）/ observed_behavior（来自用户本轮的实际选择、行为或表达方式）/ roleplay_expression（通过角色扮演的动作、剧情、台词或欲望表达）
- category: fact / preference / aversion / goal / value / habit / skill / event / emotion / relation / communication_style / roleplay_tendency / constraint（选最具体、最主要的一个）
- domain: basic_profile / career / education / technology / finance / family / friendship / romance / sexuality / kink / health / mental_health / lifestyle / hobby / ideology / personality / communication / other。其中容易混淆的六个：
  - sexuality：性取向（仅限用户自述）、性经历、性生活状态
  - kink：性方面的偏好、角色、玩法、情境设定，以及性方面的界限
  - health：身体状况、物质使用
  - mental_health：用户自述的心理状态、诊断、治疗，以及持续性的痛苦
  - ideology：政治、宗教与社会价值立场（性别角色、婚姻与家庭观、阶层等），可以是用户明说的，也可以是用户的反应所表现出的
  - education：学历层次、学校、专业、在读或毕业状态（仅限用户自述）
- temporality: atemporal / current / past / future / unknown
- persistence: stable / ongoing / transient / one_off / unknown（单次表达、单次角色扮演动作或语境有限的信息通常是 unknown，不要因为用户说了「喜欢」就自动标 stable）
- confidence: high（直接、明确、无歧义）/ medium（较清楚但有语境限制，或来自明确行为和角色扮演表达）/ low（弱信号；只在确有画像价值时才输出，不要为凑条目提取大量低置信推测）

分领域规则：
- kink：保留具体的玩法与角色，不写成「有支配倾向」这类概括。单次场景里的行为按单条事实记录，evidence_type 用 roleplay_expression。
- ideology：可以来自用户自己对事件、人物、议题的反应与评判（evidence_type=observed_behavior，confidence=medium），但绝不能从用户是谁推出立场。角色扮演中角色表达的立场不是用户的立场，除非用户跳出场景、明确说这也是自己的看法。
- mental_health：仅限用户自述，包括用户自己说出的诊断与治疗；不得由你来推断或下诊断。temporality 只用 current 或 past。
- education：仅限用户自述，不从职业或谈吐推断学历。

角色扮演规则：角色扮演可以反映真实偏好与倾向，但虚构身份、职业、家庭、地点、身体状态和剧情事件默认不是现实事实——「我是王国的公主」「我们已经结婚十年」「我刚从战场回来」都不是用户的现实。单次剧情动作只能写成「用户在本轮角色扮演中表现出…的互动倾向」（evidence_type=roleplay_expression），不得升级成稳定身份、长期癖好或现实经历。用户在角色扮演中明确自述的偏好可以忠实提取，但保留角色扮演语境，除非用户同时明确表示现实中也如此。

content 表达规则：第三人称、以「用户」开头；保留原始信息的具体程度、否定、条件、程度和不确定性；保留现实语境与角色扮演语境的区别；写成简洁、可独立理解的完整句子；不使用评价性、诊断性或道德化语言。

铁律：
- 用户事实只能来自「用户:」一方；不得把 AI 的发言、动作、身份、设定或对用户的猜测归属于用户。
- 不得根据年龄、性别、职业、国籍、兴趣或所用语言做刻板推断；不得从单一行为扩写更广的人格结论；不得自行诊断心理疾病、人格类型、性取向或医学状况。
- 不得把暂时情绪升级成长期心理特质，不得把一次性兴趣升级成稳定偏好。
- 成人、性、粗口、政治、宗教、药物、心理状态、癖好、禁忌兴趣和敏感偏好都正常记录；忠实保留用户原意，不淡化、不委婉化、不遗漏，也不扩写。你不负责安全审核、道德判断或风险过滤。
- 不得为填充数组编造信息，不得重复表达同一事实。一次最多 12 条。没有新的用户事实时返回空数组。

严格输出 JSON，且只能是以下结构。facts 是对象数组，每个对象含 content 与上述六个元数据字段，取值只能来自词汇表；没有事实时输出 {"facts":[]}。不得输出说明、Markdown、代码围栏或任何其他文本：
{"facts":[{"content":"<一条用户事实>","category":"fact","domain":"lifestyle","evidence_type":"explicit_statement","temporality":"current","persistence":"ongoing","confidence":"high"}]}
"""

# Scheduled profile rebuild: reads the user's whole fact ledger (16,000-character
# budget) and rewrites the human_insights profile row. It runs once 20 new
# facts have arrived, or once a user's newest fact has sat idle — never per
# turn. The idle sweeper is tuned by PROFILE_REBUILD_IDLE_SECS,
# PROFILE_REBUILD_TICK_SECS and PROFILE_REBUILD_BATCH, and switched off by
# PROFILE_REBUILD_DISABLED=1 (the 20-fact trigger then still fires).
# NO filter_prompt here — that prompt is built in the engine (prompt.rs) and is
# not configurable; setting the key REFUSES TO BOOT (in any shape, blank
# included) rather than being silently ignored, because it has to stay in
# lockstep with the human_insights columns it fills. To change what gets
# extracted, edit [tasks.insight_extraction].filter_prompt above.
# Delete this block and the rebuild runs on the extraction block's parameters,
# never on the global default model.
[tasks.profile_rebuild]
model = "anthropic/claude-haiku-4.5"
fallback = ["deepseek/deepseek-v4-flash","google/gemini-3.1-flash-lite"]
temperature = 0.2
max_tokens = 1200
