name: codeql

# Code scanning for the Rust workspace and the workflows themselves. The Rust
# extractor leaves `#[cfg(test)]` code out, so the scan covers what ships. A
# change that touches only Markdown or docs/ is not scanned: nothing here
# reads them. The weekly run scans whatever is on the default branch.

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    env:
      # Comma-separated cfg settings to enable, or to disable when prefixed
      # with `-`: unit-test modules are not extracted.
      CODEQL_EXTRACTOR_RUST_OPTION_CARGO_CFG_OVERRIDES: "-test"
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
