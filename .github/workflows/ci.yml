name: CI
# Pull requests are the only gate: promotes to main are fast-forwards of
# commits already tested on their PR, so no push trigger is needed. A PR that
# changes only Markdown or docs/ runs none of these checks: nothing here reads
# them. The CLA check runs on every PR from its own workflow (cla.yml).
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

# All jobs here are read-only checks (fmt / clippy / test / openapi snapshot).
# Pin the token to the minimum so a compromised action can't write.
permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eros_engine_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/eros_engine_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install sqlx-cli
        # Pin to 0.8.x: it matches the workspace's `sqlx = "0.8"`.
        run: cargo install sqlx-cli --no-default-features --features postgres --version ^0.8
      - name: Run migrations
        run: sqlx migrate run --source crates/eros-engine-store/migrations
      - run: cargo test --workspace --all-features

  openapi-snapshot:
    name: openapi-snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate OpenAPI spec
        run: |
          cargo run -p eros-engine-server --quiet -- print-openapi \
            > /tmp/openapi.fresh.json
      - name: Diff against committed snapshot
        run: |
          if ! diff -u crates/eros-engine-server/openapi.json /tmp/openapi.fresh.json; then
            echo "::error::OpenAPI snapshot drift detected — a handler or schema changed without updating crates/eros-engine-server/openapi.json"
            echo "::error::Regenerate locally: cargo run -p eros-engine-server -- print-openapi > crates/eros-engine-server/openapi.json"
            exit 1
          fi
